name: Frontend browser journeys

on:
  pull_request:
    branches: [main, develop]
  push:
    branches: [main, develop]
  workflow_dispatch:
    inputs:
      browser_journey:
        description: Run all browser journeys or one selected journey
        required: true
        default: all
        type: choice
        options:
          - all
          - auth
          - auth:password-recovery
          - auth:sign-up
          - collectivity-project-entry
          - session-recovery

permissions:
  contents: read
  packages: read

jobs:
  browser-journeys:
    name: Browser journeys
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Install Chromium and system dependencies
        run: npx playwright install --with-deps chromium

      - name: Run browser journeys
        run: |
          if [ "$BROWSER_JOURNEY" = "all" ]; then
            npm run test:browser
          else
            npm run "test:browser:$BROWSER_JOURNEY"
          fi
        env:
          BROWSER_JOURNEY: ${{ inputs.browser_journey || 'all' }}

      - name: Upload browser failure traces
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: browser-failure-traces-${{ github.run_id }}-${{ github.run_attempt }}
          path: artifacts/browser-failures/
          if-no-files-found: ignore
          retention-days: 7
