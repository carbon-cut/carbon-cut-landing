openapi: 3.0.3
info:
  title: Carbon Cut API
  version: 0.1.0
  license:
    name: MIT
    url: https://opensource.org/license/mit
  description: Backend-owned HTTP contract. Coverage starts with active collectivity project operations.
servers:
  - url: /
security:
  - bearerAuth: []
paths:
  /api/contact:
    post:
      operationId: sendContactMessage
      tags: [Contact]
      summary: Send a contact form message to the team
      security: []
      description: A nonempty website honeypot returns success without sending email. Requests are limited to five per IP in ten minutes. The sender and team inbox must be configured on the server.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name, email, topic, message]
              properties:
                name: { type: string, minLength: 1, maxLength: 150 }
                email: { type: string, format: email, maxLength: 254 }
                topic: { type: string, minLength: 1, maxLength: 200 }
                message: { type: string, minLength: 1, maxLength: 5000 }
                website:
                  type: string
                  maxLength: 200
                  description: Optional honeypot; leave empty.
      responses:
        "200":
          description: Message accepted, including honeypot submissions
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data: { $ref: "#/components/schemas/OkResponse" }
        "400": { $ref: "#/components/responses/Error" }
        "413": { $ref: "#/components/responses/Error" }
        "429": { $ref: "#/components/responses/Error" }
        "503": { $ref: "#/components/responses/Error" }
  /api/auth/local:
    post:
      operationId: login
      tags: [Authentication]
      summary: Sign in with email and password
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [identifier, password]
              properties:
                identifier: { type: string, format: email }
                password: { type: string }
      responses:
        "200":
          description: Session
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AuthSession" }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
  /api/auth/local/register:
    post:
      operationId: register
      tags: [Authentication]
      summary: Create a local account
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, firstName, lastName, password]
              properties:
                email: { type: string, format: email }
                firstName: { type: string }
                lastName: { type: string }
                organisation: { type: string, nullable: true }
                password: { type: string }
      responses:
        "200":
          description: Pending confirmation or session when confirmation is disabled
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: "#/components/schemas/RegistrationPending"
                  - $ref: "#/components/schemas/AuthSession"
        "400": { $ref: "#/components/responses/Error" }
  /api/auth/email-confirmation:
    post:
      operationId: confirmEmail
      tags: [Authentication]
      summary: Confirm email and start a session
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, confirmation]
              properties:
                email: { type: string, format: email }
                confirmation: { type: string }
      responses:
        "200":
          description: Session
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AuthSession" }
        "400": { $ref: "#/components/responses/Error" }
  /api/auth/send-email-confirmation:
    post:
      operationId: resendEmailConfirmation
      tags: [Authentication]
      summary: Resend a confirmation email
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email]
              properties:
                email: { type: string, format: email }
      responses:
        "200":
          description: Confirmation email requested
          content:
            application/json:
              schema:
                type: object
                required: [email, sent]
                properties:
                  email: { type: string, format: email }
                  sent: { type: boolean, enum: [true] }
        "400": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
  /api/auth/forgot-password:
    post:
      operationId: forgotPassword
      tags: [Authentication]
      summary: Email a password reset link
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email]
              properties:
                email: { type: string, format: email }
      responses:
        "200":
          description: Neutral acknowledgement, including unknown and blocked accounts
          content:
            application/json:
              schema: { $ref: "#/components/schemas/OkResponse" }
        "400": { $ref: "#/components/responses/Error" }
  /api/auth/reset-password:
    post:
      operationId: resetPassword
      tags: [Authentication]
      summary: Consume a single-use reset link and start a new session
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [code, password, passwordConfirmation]
              properties:
                code: { type: string, description: Random token from the emailed link }
                password: { type: string }
                passwordConfirmation: { type: string }
      responses:
        "200":
          description: Session
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AuthSession" }
        "400": { $ref: "#/components/responses/Error" }
  /api/auth/change-password:
    post:
      operationId: changePassword
      tags: [Authentication]
      summary: Change password and invalidate earlier sessions
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [currentPassword, password, passwordConfirmation]
              properties:
                currentPassword: { type: string }
                password: { type: string }
                passwordConfirmation: { type: string }
      responses:
        "200":
          description: Replacement session
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AuthSession" }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Error" }
  /api/auth/logout:
    post:
      operationId: logout
      tags: [Authentication]
      summary: Revoke one refresh token
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/RefreshRequest" }
      responses:
        "200":
          description: Revoked
          content:
            application/json:
              schema: { $ref: "#/components/schemas/OkResponse" }
        "401": { $ref: "#/components/responses/Error" }
  /api/refresh-token-rotation:
    post:
      operationId: refreshSession
      tags: [Authentication]
      summary: Rotate a refresh token once
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/RefreshRequest" }
      responses:
        "200":
          description: Replacement session
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AuthSession" }
        "401": { $ref: "#/components/responses/Error" }
  /api/collectivity/projects:
    get:
      operationId: listCollectivityProjects
      summary: List collectivity projects accessible to the current user
      tags: [Collectivity projects]
      responses:
        "200":
          description: Accessible projects
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    type: array
                    items:
                      $ref: "#/components/schemas/Project"
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
  /api/collectivity/projects/init:
    post:
      operationId: initializeCollectivityProject
      summary: Create a project using an approved subscription claim
      tags: [Collectivity projects]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/InitializeProjectRequest" }
      responses:
        "200":
          description: Created project and inventory
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ProjectSnapshotResponse" }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
  /api/collectivity/projects/{projectSlug}/current-inventory:
    parameters:
      - $ref: "#/components/parameters/ProjectSlug"
    get:
      operationId: getCollectivityCurrentInventory
      summary: Get the current inventory and its project
      tags: [Collectivity projects]
      responses:
        "200":
          description: Current inventory snapshot
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ProjectSnapshotResponse" }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
  /api/collectivity/projects/{projectSlug}/setup:
    parameters:
      - $ref: "#/components/parameters/ProjectSlug"
    put:
      operationId: updateCollectivityProjectSetup
      summary: Update the project setup
      tags: [Collectivity projects]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ProjectSetup" }
      responses:
        "200":
          description: Updated project and current inventory
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ProjectSnapshotResponse" }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
        "422": { $ref: "#/components/responses/Error" }
  /api/collectivity/projects/{projectSlug}/current-inventory/input:
    parameters:
      - $ref: "#/components/parameters/ProjectSlug"
    put:
      operationId: saveCollectivityInventoryInput
      summary: Save a current inventory draft
      tags: [Collectivity projects]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/InventoryInputRequest" }
      responses:
        "200":
          description: Saved inventory and compact project reference
          content:
            application/json:
              schema: { $ref: "#/components/schemas/InventorySaveResponse" }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
  /api/collectivity/projects/{projectSlug}/current-inventory/debug-calculate:
    parameters:
      - $ref: "#/components/parameters/ProjectSlug"
    post:
      operationId: debugCalculateCollectivityInventory
      summary: Calculate one inventory dataset without persistence
      tags: [Collectivity projects]
      x-calculation-contract:
        $ref: "#/components/schemas/WastewaterCalculationContract"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/DebugCalculationRequest" }
      responses:
        "200":
          description: Debug calculation output
          content:
            application/json:
              schema: { $ref: "#/components/schemas/DebugCalculationResponse" }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "422": { $ref: "#/components/responses/CalculationCannotRun" }
  /api/collectivity/projects/{projectSlug}/current-inventory/calculate:
    parameters:
      - $ref: "#/components/parameters/ProjectSlug"
    post:
      operationId: calculateCollectivityInventory
      summary: Save and calculate the current inventory
      description: The submitted input remains saved as a draft when calculation readiness fails.
      tags: [Collectivity projects]
      x-calculation-contract:
        $ref: "#/components/schemas/WastewaterCalculationContract"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/InventoryInputRequest" }
      responses:
        "200":
          description: Stored calculation artifacts
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CalculationResponse" }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "422": { $ref: "#/components/responses/CalculationCannotRun" }
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  parameters:
    ProjectSlug:
      name: projectSlug
      in: path
      required: true
      schema: { type: string }
  responses:
    Error:
      description: Request failed
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ErrorResponse" }
    CalculationCannotRun:
      description: The submitted inventory cannot be calculated
      content:
        application/json:
          schema: { $ref: "#/components/schemas/CalculationCannotRunResponse" }
  schemas:
    RegistrationPending:
      type: object
      required: [user, confirmation_required, confirmation_email_sent]
      properties:
        user: { $ref: "#/components/schemas/AuthUser" }
        confirmation_required: { type: boolean, enum: [true] }
        confirmation_email_sent: { type: boolean, enum: [true] }
    RefreshRequest:
      type: object
      required: [refresh_token]
      properties:
        refresh_token: { type: string }
    OkResponse:
      type: object
      required: [ok]
      properties:
        ok: { type: boolean, enum: [true] }
    AuthUser:
      type: object
      required: [id, firstName, lastName, email, provider, confirmed, blocked]
      properties:
        id: { type: integer }
        firstName: { type: string }
        lastName: { type: string }
        organisation: { type: string, nullable: true }
        email: { type: string, format: email }
        provider: { type: string }
        confirmed: { type: boolean }
        blocked: { type: boolean }
        planId:
          type: array
          items: { type: string }
    AuthSession:
      type: object
      required: [access_token, refresh_token, user]
      properties:
        access_token: { type: string }
        refresh_token: { type: string }
        user: { $ref: "#/components/schemas/AuthUser" }
    JsonObject:
      type: object
      additionalProperties: true
    WastewaterLoadType:
      type: string
      enum: [domestic, industrial, unclassified]
    WastewaterTreatmentSystem:
      type: string
      enum:
        - centralizedAerobic
        - anaerobicReactor
        - anaerobicShallowFacultativeLagoon
        - anaerobicDeepLagoon
        - constructedWetlandSurfaceFlow
        - constructedWetlandHorizontalSubsurfaceFlow
        - constructedWetlandVerticalSubsurfaceFlow
        - septicTank
        - septicTankLandDispersal
        - stagnantSewer
        - flowingSewer
        - latrineDryHousehold
        - latrineDryCommunal
        - latrineWetOrFlush
        - aquaticDischarge
    WastewaterIndustrialTreatmentSystem:
      type: string
      enum:
        - centralizedAerobic
        - anaerobicReactor
        - anaerobicShallowFacultativeLagoon
        - anaerobicDeepLagoon
        - constructedWetlandSurfaceFlow
        - constructedWetlandHorizontalSubsurfaceFlow
        - constructedWetlandVerticalSubsurfaceFlow
        - aquaticDischarge
    WastewaterReceivingWater:
      type: string
      enum: [otherAquatic, reservoirLakeEstuary, unknown]
    WastewaterEffluentPath:
      type: string
      enum: [measuredOutgoingLoad, treatmentLevel]
    WastewaterEffluentTreatmentLevel:
      type: string
      enum: [untreated, primaryMechanical, secondaryBiological, advancedBiological, notEstimated]
    WastewaterSludgePathway:
      type: string
      enum: [anaerobicDigestion, composting, landfill, incineration, landApplication, notEstimated]
    WastewaterLandfillClimate:
      type: string
      enum: [temperateDry, temperateWet, tropicalDry, tropicalWet]
    WastewaterLandfillSiteType:
      type: string
      enum: [managedAnaerobic, unmanagedDeep, unmanagedShallow, uncategorised]
    WastewaterLandfillOxidationCover:
      type: string
      enum: [noneOrUnspecified, managedCoveredWithOxidizingMaterial]
    WastewaterUnit:
      type: string
      enum: [kg BOD, kg COD, kg N, kg CH4, t wet sludge, "%", capita]
    WastewaterCapabilityMatrix:
      type: object
      readOnly: true
      required: [domesticBod, industrialCod, unclassifiedBodDomesticProxy]
      properties:
        domesticBod:
          type: array
          uniqueItems: true
          minItems: 15
          maxItems: 15
          items: { $ref: "#/components/schemas/WastewaterTreatmentSystem" }
          example:
            - centralizedAerobic
            - anaerobicReactor
            - anaerobicShallowFacultativeLagoon
            - anaerobicDeepLagoon
            - constructedWetlandSurfaceFlow
            - constructedWetlandHorizontalSubsurfaceFlow
            - constructedWetlandVerticalSubsurfaceFlow
            - septicTank
            - septicTankLandDispersal
            - stagnantSewer
            - flowingSewer
            - latrineDryHousehold
            - latrineDryCommunal
            - latrineWetOrFlush
            - aquaticDischarge
        industrialCod:
          type: array
          uniqueItems: true
          minItems: 8
          maxItems: 8
          items: { $ref: "#/components/schemas/WastewaterIndustrialTreatmentSystem" }
          example:
            - centralizedAerobic
            - anaerobicReactor
            - anaerobicShallowFacultativeLagoon
            - anaerobicDeepLagoon
            - constructedWetlandSurfaceFlow
            - constructedWetlandHorizontalSubsurfaceFlow
            - constructedWetlandVerticalSubsurfaceFlow
            - aquaticDischarge
        unclassifiedBodDomesticProxy:
          type: array
          uniqueItems: true
          minItems: 15
          maxItems: 15
          items: { $ref: "#/components/schemas/WastewaterTreatmentSystem" }
          description: Unclassified BOD is calculated through the explicit domestic-method proxy.
          example:
            - centralizedAerobic
            - anaerobicReactor
            - anaerobicShallowFacultativeLagoon
            - anaerobicDeepLagoon
            - constructedWetlandSurfaceFlow
            - constructedWetlandHorizontalSubsurfaceFlow
            - constructedWetlandVerticalSubsurfaceFlow
            - septicTank
            - septicTankLandDispersal
            - stagnantSewer
            - flowingSewer
            - latrineDryHousehold
            - latrineDryCommunal
            - latrineWetOrFlush
            - aquaticDischarge
    WastewaterWetSludgeAnnualSeries:
      type: object
      required: [value, unit]
      properties:
        value:
          type: object
          description: Complete y-YYYY map from site commissioning through the maximum calculated year.
          additionalProperties: { type: number, minimum: 0 }
        unit: { type: string, enum: [t wet sludge] }
    WastewaterMethaneRecoveryAnnualSeries:
      type: object
      required: [value, unit]
      properties:
        value:
          type: object
          additionalProperties: { type: number, minimum: 0 }
        unit: { type: string, enum: [kg CH4] }
    WastewaterLandfillSite:
      type: object
      required:
        [
          landfillIdentifier,
          commissioningYear,
          climate,
          landfillSiteType,
          oxidationCover,
          disposalHistory,
          methaneRecovery,
        ]
      properties:
        landfillIdentifier: { type: string, minLength: 1 }
        commissioningYear: { type: integer }
        climate: { $ref: "#/components/schemas/WastewaterLandfillClimate" }
        landfillSiteType: { $ref: "#/components/schemas/WastewaterLandfillSiteType" }
        oxidationCover: { $ref: "#/components/schemas/WastewaterLandfillOxidationCover" }
        disposalHistory:
          type: object
          required: [domestic, industrial]
          properties:
            domestic: { $ref: "#/components/schemas/WastewaterWetSludgeAnnualSeries" }
            industrial: { $ref: "#/components/schemas/WastewaterWetSludgeAnnualSeries" }
        methaneRecovery: { $ref: "#/components/schemas/WastewaterMethaneRecoveryAnnualSeries" }
    WastewaterLandfillSites:
      type: object
      required: [dataSet]
      properties:
        dataSet:
          type: array
          items: { $ref: "#/components/schemas/WastewaterLandfillSite" }
    CalculationReasonCode:
      type: string
      enum:
        - missingCalculationInput
        - invalidInput
        - missingParameter
        - unsupportedDataset
        - RExceedInput
        - invalidControlledValue
        - unsupportedWastewaterMethod
        - missingAnnualDependency
        - orphanAnnualValue
        - invalidUnit
        - invalidRange
        - populationAllocationExceeded
        - populationActivityConflict
        - methaneRecoveryNotSupported
        - missingLandfillSite
        - landfillSiteConflict
        - landfillHistoryMismatch
    CalculationWarningCode:
      type: string
      enum:
        - negativeEstimatedActivityClamped
        - missingLtoCorrectionFactorDefaulted
        - treeAbsorptionFactorFallbackUsed
        - greenWasteAbsorptionFallbackUsed
        - wastewaterEffluentNotEstimated
        - wastewaterEffluentNitrogenNotEstimated
        - wastewaterLandfillNotEstimated
        - wastewaterPopulationUnallocated
        - wastewaterUnclassifiedDomesticProxyUsed
        - wastewaterReceivingWaterTier1FallbackUsed
        - wastewaterRecoveryIncludedInFactor
        - manureBeddingNitrogenNotEstimated
        - portNavigationNotEstimated
    WastewaterCalculationContract:
      type: object
      readOnly: true
      description: >-
        Backend-owned calculation-readiness contract. Draft inventory storage remains a permissive
        JsonObject; zero is an explicitly supplied annual value and validation is limited to active
        inventory years and in-boundary rows.
      required: [controlledValues, capabilityMatrix, landfillSites, reasonCodes, warningCodes]
      properties:
        controlledValues:
          type: object
          required:
            [
              loadTypes,
              treatmentSystems,
              receivingWaters,
              effluentPaths,
              effluentTreatmentLevels,
              sludgePathways,
              units,
            ]
          properties:
            loadTypes:
              type: array
              items: { $ref: "#/components/schemas/WastewaterLoadType" }
            treatmentSystems:
              type: array
              items: { $ref: "#/components/schemas/WastewaterTreatmentSystem" }
            receivingWaters:
              type: array
              items: { $ref: "#/components/schemas/WastewaterReceivingWater" }
            effluentPaths:
              type: array
              items: { $ref: "#/components/schemas/WastewaterEffluentPath" }
            effluentTreatmentLevels:
              type: array
              items: { $ref: "#/components/schemas/WastewaterEffluentTreatmentLevel" }
            sludgePathways:
              type: array
              items: { $ref: "#/components/schemas/WastewaterSludgePathway" }
            units:
              type: array
              items: { $ref: "#/components/schemas/WastewaterUnit" }
        capabilityMatrix: { $ref: "#/components/schemas/WastewaterCapabilityMatrix" }
        landfillSites: { $ref: "#/components/schemas/WastewaterLandfillSites" }
        reasonCodes:
          type: array
          items: { $ref: "#/components/schemas/CalculationReasonCode" }
        warningCodes:
          type: array
          items: { $ref: "#/components/schemas/CalculationWarningCode" }
    ProjectSetup:
      type: object
      required: [name, slug, country, territory, referenceYear, inventoryYears, applicability]
      properties:
        name: { type: string, minLength: 1 }
        slug: { type: string, pattern: "^[a-z0-9]+(?:-[a-z0-9]+)*$" }
        country: { type: string, pattern: "^[A-Z]{3}$" }
        territory: { type: string, minLength: 1 }
        referenceYear: { type: integer }
        inventoryYears:
          type: array
          minItems: 1
          uniqueItems: true
          items: { type: integer }
          description: Must include referenceYear.
        applicability:
          type: object
          required: [port, agriculture]
          properties:
            airport:
              { type: boolean, description: Optional on input; backend defaults it to false. }
            port: { type: boolean }
            agriculture: { type: boolean }
    InitializeProjectRequest:
      allOf:
        - $ref: "#/components/schemas/ProjectSetup"
        - type: object
          required: [approvedClaimId]
          properties:
            approvedClaimId: { type: integer, minimum: 1 }
    Project:
      type: object
      required:
        [
          id,
          slug,
          name,
          territory,
          country,
          referenceYear,
          inventoryYears,
          currentInventoryId,
          createdAt,
          updatedAt,
        ]
      properties:
        id: { type: string }
        slug: { type: string }
        name: { type: string }
        territory: { type: string }
        country: { type: string, nullable: true }
        referenceYear: { type: integer }
        inventoryYears:
          type: array
          items: { type: integer }
        currentInventoryId: { type: string, nullable: true }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
    Inventory:
      type: object
      required:
        [
          id,
          projectId,
          setupPayload,
          inventoryInput,
          status,
          lockedYears,
          latestCalculationRunId,
          createdAt,
          updatedAt,
        ]
      properties:
        id: { type: string }
        projectId: { type: string, nullable: true }
        setupPayload: { $ref: "#/components/schemas/ProjectSetup" }
        inventoryInput:
          type: object
          nullable: true
          additionalProperties: true
        status: { type: string, enum: [draft, calculated, outdated] }
        lockedYears:
          type: array
          items: { type: integer }
        latestCalculationRunId: { type: string, nullable: true }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
    ProjectSnapshot:
      type: object
      required: [project, currentInventory]
      properties:
        project: { $ref: "#/components/schemas/Project" }
        currentInventory: { $ref: "#/components/schemas/Inventory" }
    ProjectSnapshotResponse:
      type: object
      required: [data]
      properties:
        data: { $ref: "#/components/schemas/ProjectSnapshot" }
    InventoryInputRequest:
      type: object
      required: [inventoryInput]
      properties:
        inventoryInput: { $ref: "#/components/schemas/JsonObject" }
    DebugCalculationRequest:
      type: object
      required: [datasetKey, inventoryInput]
      properties:
        datasetKey: { type: string, minLength: 1 }
        inventoryInput: { $ref: "#/components/schemas/JsonObject" }
    CalculationWarning:
      type: object
      required: [code, message]
      properties:
        code: { $ref: "#/components/schemas/CalculationWarningCode" }
        itemId: { type: string }
        path: { type: string }
        message: { type: string }
        details: { $ref: "#/components/schemas/JsonObject" }
    DebugCalculationResponse:
      type: object
      required: [data]
      properties:
        data:
          type: object
          required: [datasetKey, resultRows, energyRows, parameterSnapshot, formulaVersion]
          properties:
            datasetKey: { type: string }
            resultRows: { $ref: "#/components/schemas/JsonObject" }
            energyRows: { $ref: "#/components/schemas/JsonObject" }
            parameterSnapshot: { $ref: "#/components/schemas/JsonObject" }
            formulaVersion: { type: string }
            warnings:
              type: array
              items: { $ref: "#/components/schemas/CalculationWarning" }
    CalculationResponse:
      type: object
      required: [data]
      properties:
        data:
          type: object
          required: [context, output, runData, resultData, persisted]
          properties:
            context: { $ref: "#/components/schemas/JsonObject" }
            output: { $ref: "#/components/schemas/JsonObject" }
            runData: { $ref: "#/components/schemas/JsonObject" }
            resultData: { $ref: "#/components/schemas/JsonObject" }
            persisted: { $ref: "#/components/schemas/JsonObject" }
    CalculationCannotRunReason:
      type: object
      required: [code]
      properties:
        code: { $ref: "#/components/schemas/CalculationReasonCode" }
        path: { type: string }
        paths:
          type: array
          items: { type: string }
        parameterKey: { type: string }
        year: { type: integer }
        details: { $ref: "#/components/schemas/JsonObject" }
    CalculationCannotRunResponse:
      type: object
      required: [data, error]
      properties:
        data: { type: object, nullable: true }
        error:
          type: object
          required: [status, name, message, details]
          properties:
            status: { type: integer, enum: [422] }
            name: { type: string, enum: [ApplicationError] }
            message: { type: string, enum: [calculationCannotRun, debugCalculationCannotRun] }
            details:
              type: object
              required: [datasetKey, reasons]
              properties:
                datasetKey: { type: string }
                reasons:
                  type: array
                  items: { $ref: "#/components/schemas/CalculationCannotRunReason" }
    InventorySaveProject:
      type: object
      required: [id, slug, currentInventoryId, updatedAt]
      properties:
        id: { type: string }
        slug: { type: string }
        currentInventoryId: { type: string, nullable: true }
        updatedAt: { type: string, format: date-time }
    InventorySaveResponse:
      type: object
      required: [data]
      properties:
        data:
          type: object
          required: [project, currentInventory]
          properties:
            project: { $ref: "#/components/schemas/InventorySaveProject" }
            currentInventory: { $ref: "#/components/schemas/Inventory" }
    ErrorResponse:
      type: object
      required: [data, error]
      properties:
        data: { type: object, nullable: true }
        error:
          type: object
          required: [status, name, message, details]
          properties:
            status: { type: integer }
            name: { type: string }
            message: { type: string }
            details: { $ref: "#/components/schemas/JsonObject" }
